name: CI & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nutrition_tracker
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm ci
          cd server && npm ci && cd ..
          cd client && npm ci && cd ..

      - name: Run Prisma Migrations & Seed
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/nutrition_tracker?schema=public"
        run: |
          cd server
          npx prisma db push
          npm run prisma:seed
          cd ..

      - name: Run Server Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/nutrition_tracker?schema=public"
        run: |
          cd server
          npm test
          cd ..

      - name: Build Server
        run: |
          cd server
          npm run build
          cd ..

      - name: Build Frontend
        run: |
          cd client
          npm run build
          cd ..
